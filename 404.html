  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #5ba8d4;

      flex-direction: column;
      align-items: center;

    .bubble {

    }

      0% { transform: translateY(0); opacity: 0.5; }

    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    .four04 {
      font-size: 10rem;
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      letter-spacing: -6px;
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    h1 { font-size: 1.8rem; color: #fff; margin-bottom: 12px; }
    p { font-size: 1rem; color: rgba(255,255,255,0.85); max-width: 340px; line-height: 1.7; margin: 0 auto 32px; }
    .btn {
      background: #ffa44a;
      color: #fff;
      padding: 14px 36px;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #e8903a; }
    .creature {
      position: absolute;
      color: rgba(10,40,80,0.45);
      animation: swim linear infinite;
    }
    .creature-r {
      position: absolute;
      color: rgba(10,40,80,0.45);
      animation: swimr linear infinite;
    }
    @keyframes swim {
      0% { left: -80px; }
      100% { left: calc(100vw + 80px); }
    }
    @keyframes swimr {
      0% { left: calc(100vw + 80px); transform: scaleX(-1); }
      100% { left: -80px; transform: scaleX(-1); }
    }
  </style>
</head>
