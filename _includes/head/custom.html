<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">
  <i class="fas fa-chevron-up"></i>
</button>
{% if page.layout == 'single' and page.url contains '/posts/' %}
<a href="/posts/" id="back-to-notes" aria-label="Back to Field Notes">
  <i class="fas fa-arrow-left"></i> Field Notes
</a>
{% endif %}

<script>
window.addEventListener('scroll', function() {
  const btn = document.getElementById('back-to-top');
  if (btn) {
    if (window.scrollY > 400) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  }
});
</script>
